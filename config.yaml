# ---------------------------------------------------------------------------
# Utrains Pulse — configuration
# Ce fichier se modifie sans toucher au code : sources, mots-clés, seuils.
# ---------------------------------------------------------------------------

general:
  # Fuseau utilisé pour la date affichée dans le message.
  timezone: America/Chicago
  # Fenêtre par défaut quand aucune exécution précédente n'est connue (heures).
  lookback_hours: 24
  # Garde-fou : on ne remonte jamais plus loin, même après plusieurs échecs.
  max_lookback_hours: 72
  # Nombre de sujets publiés au maximum.
  max_topics: 10
  # Importance minimale (1 à 5) pour qu'un sujet soit publié.
  min_importance: 3
  # Taille max du contenu envoyé à Gemini, par article (caractères).
  max_article_chars: 2000
  # Nombre max d'articles envoyés à Gemini (protection coût / contexte).
  max_articles_to_analyze: 120
  # Nombre max d'articles retenus par source (évite qu'un flux noie les autres).
  max_articles_per_source: 25
  # Anti-doublon : fichier d'état et durée de conservation.
  state_file: sent.json
  state_retention_days: 30
  # Réseau
  http_timeout: 20
  feed_workers: 8
  url_check_workers: 12
  # Vérification que chaque URL répond bien 200 (HEAD puis GET).
  verify_urls: true
  # Filtrage par mots-clés appliqué par défaut aux sources généralistes.
  filter_keywords_by_default: true

gemini:
  # Modèles essayés dans l'ordre. On passe au suivant si l'un est inconnu
  # (404), surchargé (503) ou au quota (429). La variable d'environnement
  # GEMINI_MODEL, si elle existe, est essayée en premier.
  models:
    - gemini-3.8-flash
    - gemini-flash-latest
    - gemini-3.8-flash-lite
  temperature: 0.2
  # Nombre de séries complètes sur la liste de modèles, avec pause entre deux.
  max_attempts: 3

discord:
  # Nom affiché comme auteur des messages (surcharge le nom du webhook).
  username: Utrains Pulse
  # Limites Discord : 25 champs par embed, 10 embeds et 6000 caractères par
  # message. On garde une marge, le reste part dans un message suivant.
  max_fields_per_embed: 15
  max_message_chars: 5500
  max_attempts: 4

# Mots-clés du périmètre. Un article issu d'une source généraliste doit en
# contenir au moins un (titre ou résumé) pour être collecté.
