    - inference
    - fine-tuning
    - gpu
    - transformers

# ---------------------------------------------------------------------------
# Sources : uniquement des flux officiels RSS/Atom.
#   name            : nom affiché dans le message
#   url             : URL du flux
#   domain          : DevOps | DevSecOps | Cloud | LLMOps
#   enabled         : true / false
#   filter_keywords : true pour les sources généralistes (défaut : general)
#   official_for    : outils dont cette source est l'éditeur officiel.
#                     Sert à afficher la source officielle en premier.
# ---------------------------------------------------------------------------
sources:
  # --- Cloud ---------------------------------------------------------------
  - name: AWS What's New
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
    domain: Cloud
    enabled: true
    filter_keywords: true
    official_for: [aws, eks, ecs, fargate, lambda, bedrock, cloudformation]

  - name: Google Cloud Release Notes
    url: https://cloud.google.com/feeds/gcp-release-notes.xml
    domain: Cloud
    enabled: true
    filter_keywords: true
    official_for: [google cloud, gcp, gke, cloud run, vertex ai]

  - name: Azure Updates
    url: https://www.microsoft.com/releasecommunications/api/v2/azure/rss
    domain: Cloud
    enabled: true
    filter_keywords: true
    official_for: [azure, aks, azure ai foundry, azure devops, entra]

  # --- DevOps --------------------------------------------------------------
  - name: Kubernetes Blog
    url: https://kubernetes.io/feed.xml
    domain: DevOps
    enabled: true
    filter_keywords: false
    official_for: [kubernetes, k8s, kubectl]

  - name: CNCF Blog
    url: https://www.cncf.io/feed/
    domain: DevOps
    enabled: true
    filter_keywords: true
    official_for: [cncf, prometheus, opentelemetry, envoy, containerd, argo, helm]

  - name: HashiCorp Blog
