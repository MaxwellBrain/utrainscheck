    - k8s
    - kubectl
    - helm
    - argocd
    - argo cd
    - gitops
    - terraform
    - opentofu
    - ansible
    - pulumi
    - github
    - github actions
    - gitlab
    - gitlab ci
    - jenkins
    - ci/cd
    - pipeline
    - prometheus
    - grafana
    - loki
    - opentelemetry
    - observability
    - observabilité
    - vault
    - trivy
    - sonarqube
    - sbom
    - supply chain
    - cve
    - vulnerability
    - vulnérabilité
    - devsecops
    - devops
    - sre
    - service mesh
    - istio
    - envoy
    - runner
    - registry
    # Cloud
    - aws
    - eks
    - ecs
    - fargate
    - lambda
    - google cloud
    - gke
    - cloud run
    - azure
    - aks
    - iam
    - serverless
    # LLMOps
    - vllm
    - ollama
    - langchain
    - langgraph
    - llamaindex
    - mcp
    - model context protocol
    - rag
    - embedding
    - vector database
    - vector store
    - pgvector
    - qdrant
    - weaviate
    - milvus
    - pinecone
    - langfuse
    - mlflow
    - bedrock
    - vertex ai
    - azure ai foundry
    - llm
