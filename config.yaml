    filter_keywords: false
    official_for: [docker, docker hub, docker compose, buildx]

  # --- DevSecOps -----------------------------------------------------------
  # Le flux KEV historique (known_exploited_vulnerabilities.xml) n'existe plus ;
  # les ajouts au catalogue KEV sont publiés dans les alertes CISA.
  - name: CISA Alerts (KEV)
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    domain: DevSecOps
