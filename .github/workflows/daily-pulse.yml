name: Utrains Pulse

on:
  schedule:
    # GitHub Actions ne planifie qu'en UTC. 8h00 à America/Chicago correspond à
    # 14h00 UTC en hiver (CST) et 13h00 UTC en été (CDT) : on déclenche aux deux
    # heures et l'étape « gate » ne laisse passer que 8h00 locales.
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour commiter sent.json (anti-doublon)

concurrency:
  group: utrains-pulse
  cancel-in-progress: false

jobs:
  pulse:
    name: Veille DevOps / LLMOps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier qu'il est bien 8h00 à Chicago
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR="$(TZ=America/Chicago date +%H)"
          echo "Heure locale (America/Chicago) : ${HOUR}h00"
          if [ "$EVENT_NAME" != "schedule" ] || [ "$HOUR" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "➡️  Exécution de la veille."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Exécution ignorée (ce créneau UTC ne correspond pas à 8h00 locales)."
          fi

      - name: Installer Python 3.12
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer la veille
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python main.py

      - name: Mémoriser les articles envoyés (sent.json)
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain sent.json)" ]; then
            echo "Aucun changement à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git commit -m "chore(pulse): mise à jour de l'anti-doublon [skip ci]"
          git push || {
            echo "Push refusé, nouvelle tentative après rebase."
            git pull --rebase --autostash
            git push
          }

      - name: Signaler l'échec dans Discord
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          python - <<'PY' > payload.json
          import json, os
          print(json.dumps({
              "content": "🔴 **Utrains Pulse** — le job GitHub Actions a échoué.\n"
                      f"Logs : {os.environ['RUN_URL']}"
          }, ensure_ascii=False))
          PY
          curl -sS -X POST -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK" > /dev/null
